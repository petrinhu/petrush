# .github/workflows/ci.yml
# CI for petrush — container Fedora (espelha host do líder: Fedora 44)
# Matrix: clang + gcc × Release/Debug
# Runs: configure, build, unit tests, smoke, lint best-effort

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      # Stable atual (= latest no registry Fedora em 2026-08). Host do líder: 44.
      image: registry.fedoraproject.org/fedora:44
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang, gcc]
        build-type: [Release, Debug]
    steps:
      - uses: actions/checkout@v4

      - name: Install deps (dnf)
        run: |
          dnf -y install \
            gcc gcc-c++ clang clang-tools-extra \
            cmake make \
            valgrind cppcheck \
            glibc-devel \
            diffutils findutils which
          command -v cmake
          gcc --version | head -1
          clang --version | head -1

      - name: Configure
        env:
          CC: ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }}
          CXX: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
            -DCMAKE_C_COMPILER=$CC \
            -DCMAKE_CXX_COMPILER=$CXX \
            -DENABLE_COVERAGE=OFF

      - name: Build (binários + testes, sem verify ALL)
        # evita o target verify ALL (lint/valgrind soft) no path crítico
        run: cmake --build build -j "$(nproc)" --target petrush pudod test_parser test_process test_env test_info test_pudo test_alias test_complete test_dirstack test_hist_expand test_expand

      - name: Unit tests (ctest)
        run: cmake --build build --target check

      # SEC-02 (NDEBUG): pudod sibling em build/ e rejeitado em Release.
      # Instalar no prefixo canônico /usr/local (sem setuid) e smoke no binário
      # instalado. Prefixos arbitrários (ex. /tmp/...) nao entram na allow-list.
      # TST-T15: espelhar este path no pre-CI local.
      - name: Install prefix (Release, sem setuid)
        if: matrix.build-type == 'Release'
        run: |
          cmake --install build --prefix /usr/local
          test -x /usr/local/bin/petrush
          test -x /usr/local/libexec/petrush-pudod \
            || test -x /usr/local/libexec/pudod \
            || test -x /usr/local/bin/pudod
          # NUNCA chmod u+s / setuid neste job

      - name: Smoke integrado
        run: |
          if [ "${{ matrix.build-type }}" = "Release" ]; then
            bash tests/smoke/pudo-smoke.sh /usr/local/bin/petrush
          else
            bash tests/smoke/pudo-smoke.sh ./build/petrush
          fi

      # Lint best-effort no GHA (nao e gate duro). Gate duro de lint = TST-T15
      # (scripts/tst-t15-preci.sh) sem || true.
      - name: Lint (best-effort)
        run: |
          cmake --build build --target cppcheck || true
          cmake --build build --target clang-tidy || true
          cmake --build build --target lint || true

      - name: Valgrind pudod (best-effort)
        run: |
          cmake --build build --target pudod-valgrind || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-fedora44-${{ matrix.compiler }}-${{ matrix.build-type }}
          path: |
            build/petrush
            build/pudod
            build/test_*
          retention-days: 5

  # Opcional: job experimental na imagem mais nova (45/rawhide). Não bloqueia main.
  build-fedora-next:
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: registry.fedoraproject.org/fedora:45
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          dnf -y install gcc clang cmake make valgrind cppcheck clang-tools-extra glibc-devel
      - name: Build Release gcc + install + smoke
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc
          cmake --build build -j "$(nproc)" --target petrush pudod test_parser test_process test_env test_info test_pudo test_alias test_complete test_dirstack test_hist_expand test_expand test_prompt
          cmake --build build --target check
          cmake --install build --prefix /usr/local
          bash tests/smoke/pudo-smoke.sh /usr/local/bin/petrush
